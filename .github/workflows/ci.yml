name: CI
on:
  pull_request:
  push:
    branches: [main, integration/postgresql-release, ci/postgresql-vercel]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sportshub
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: sportshub_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sportshub -d sportshub_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://sportshub:test_only_password@localhost:5432/sportshub_test
      TEST_DATABASE_URL: postgresql://sportshub:test_only_password@localhost:5432/sportshub_test
      E2E_DATABASE_URL: postgresql://sportshub:test_only_password@localhost:5432/sportshub_test
      AUTH_SECRET: ci-test-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: UTC
      - run: npm test
        env:
          TZ: Asia/Ho_Chi_Minh
      - run: node --import tsx eval/ai/run-benchmark.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TZ: UTC
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
